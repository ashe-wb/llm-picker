name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: '! git ls-files --error-unmatch HANDOFF.md 2>/dev/null'
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
